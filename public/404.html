<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Money</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Stores the path and redirects to index.html which handles routing
    const path = window.location.pathname;
    sessionStorage.setItem('gh-pages-redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
